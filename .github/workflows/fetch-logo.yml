name: Fetch Worksmarto logo (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download logo from worksmarto.com
        run: |
          curl -fsSL -A "Mozilla/5.0" -o assets/logo.png \
            "https://worksmarto.com/wp-content/uploads/2026/04/cropped-ChatGPT-Image-Apr-2-2026-12_05_09-PM-1.png"
          file assets/logo.png
          file assets/logo.png | grep -q 'PNG image data'
      - name: Commit logo
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/logo.png
          git diff --cached --quiet || git commit -m "Add Worksmarto logo to the news site"
          git push
