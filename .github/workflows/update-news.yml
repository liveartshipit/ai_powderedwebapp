name: Daily AI News update

on:
  schedule:
    - cron: '30 0 * * *'   # 00:30 UTC = 06:00 IST, every day
    - cron: '15 2 * * *'   # 02:15 UTC = 07:45 IST backup: GitHub sometimes delays or skips scheduled runs; a second run just finds nothing new
  workflow_dispatch:        # "Run workflow" button for manual runs
  push:
    branches: [main]
    paths-ignore: ['data/news.json']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and summarise news
        if: github.event_name != 'push'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          SEC_CONTACT_EMAIL: ${{ vars.SEC_CONTACT_EMAIL }}
        run: node scripts/fetch-news.mjs

      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "news: daily update $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
